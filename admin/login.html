<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin · Costa Reis Moda Fitness</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page">
    <main>
        <div class="login-container">
            <h1 class="login-title">Costa Reis Moda Fitness<span style="color: #b08a7a;">.</span></h1>
            <p class="login-subtitle">Painel Administrativo</p>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Senha</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    Entrar
                </button>

                <p id="loginMessage" class="login-message"></p>
            </form>

            <p class="login-footer">
                <a href="../index.html">← Voltar para a loja</a>
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
